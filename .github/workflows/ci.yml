name: CI
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GO
        uses: actions/setup-go@v5
        with: 
          go-version: '1.25.x'

      - uses: extractions/setup-just@v3

      - name : Install dependencies
        run: |
          go get .

      - name: Run tests
        run: just test

